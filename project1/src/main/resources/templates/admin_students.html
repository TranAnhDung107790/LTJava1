<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Sinh Viên - AdminLTE 4</title>
    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- AdminLTE 4 (dist/css/adminlte.min.css) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- Navbar -->
        <nav class="app-header navbar navbar-expand bg-body">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="fa-solid fa-bars"></i></a>
                    </li>
                    <li class="nav-item d-none d-md-block">
                        <a href="#" class="nav-link">Trang chủ</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Sidebar -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand">
                <a href="#" class="brand-link">
                    <span class="brand-text fw-light"><b>Quản Lý</b> Đào Tạo</span>
                </a>
            </div>
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                        <li class="nav-item">
                            <a href="/admin" class="nav-link active">
                                <i class="nav-icon fa-solid fa-graduation-cap"></i>
                                <p>Danh sách Sinh viên</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <h3 class="mb-0">Quản Lý Sinh Viên</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="app-content">
                <div class="container-fluid">
                    <!-- Form thêm mới -->
                    <div class="card card-primary card-outline mb-4">
                        <div class="card-header">
                            <div class="card-title">Thêm sinh viên mới</div>
                        </div>
                        <form id="adminStudentForm">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Mã Sinh Viên</label>
                                        <input type="text" id="adminCode" class="form-control" required placeholder="SV001">
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Họ và Tên</label>
                                        <input type="text" id="adminName" class="form-control" required placeholder="Nguyễn Văn A">
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" id="adminEmail" class="form-control" required placeholder="sv@gmail.com">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Số Điện Thoại</label>
                                        <input type="text" id="adminPhone" class="form-control" placeholder="0901234567">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Lớp</label>
                                        <input type="text" id="adminClass" class="form-control" placeholder="C2024A">
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i> Lưu lại</button>
                            </div>
                        </form>
                    </div>

                    <!-- Bảng danh sách sinh viên -->
                    <div class="card card-outline card-success mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h3 class="card-title">Danh sách sinh viên</h3>
                            <div class="card-tools d-flex">
                                <div class="input-group input-group-sm" style="width: 250px;">
                                    <input type="text" id="adminSearchKeyword" class="form-control" placeholder="Tìm kiếm sinh viên...">
                                    <button class="btn btn-default" onclick="fetchAdminStudents()"><i class="fa-solid fa-magnifying-glass"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="card-body table-responsive p-0">
                            <table class="table table-hover table-striped text-nowrap align-middle">
                                <thead>
                                    <tr>
                                        <th>Mã SV</th>
                                        <th>Họ và Tên</th>
                                        <th>Email</th>
                                        <th>Số điện thoại</th>
                                        <th>Lớp học</th>
                                        <th class="text-center">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="adminTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script AdminLTE 4 & Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>

    <script>
        const API_URL = '/api/students';

        function fetchAdminStudents() {
            const keyword = document.getElementById('adminSearchKeyword').value;
            const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('adminTableBody');
                    tbody.innerHTML = '';
                    data.forEach(s => {
                        tbody.innerHTML += `
                            <tr>
                                <td><span class="badge bg-secondary">${s.studentCode}</span></td>
                                <td class="fw-bold">${s.fullName}</td>
                                <td>${s.email}</td>
                                <td>${s.phone || '-'}</td>
                                <td><span class="badge bg-info">${s.className || '-'}</span></td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-danger" onclick="deleteAdminStudent('${s.id}')">
                                        <i class="fa-solid fa-trash me-1"></i> Xóa
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        document.getElementById('adminStudentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                studentCode: document.getElementById('adminCode').value,
                fullName: document.getElementById('adminName').value,
                email: document.getElementById('adminEmail').value,
                phone: document.getElementById('adminPhone').value,
                className: document.getElementById('adminClass').value
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if (res.ok) {
                    alert('Thêm sinh viên thành công!');
                    document.getElementById('adminStudentForm').reset();
                    fetchAdminStudents();
                }
            });
        });

        function deleteAdminStudent(id) {
            if (confirm('Xác nhận xóa sinh viên?')) {
                fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                    .then(res => {
                        if (res.ok) {
                            fetchAdminStudents();
                        }
                    });
            }
        }

        fetchAdminStudents();
    </script>
</body>
</html>
