<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Hệ thống Quản lý Đào tạo - Nhóm 11</title>
    <link rel="icon" type="image/png" href="/assets/img/logo-donga.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/adminlte/css/adminlte.css" />
    <style>
        body { background: linear-gradient(135deg, #eef3ff 0%, #fdf6ff 55%, #eefbf6 100%); min-height: 100vh; }
        .login-card { max-width: 420px; margin: 6vh auto; border: 0; border-radius: 18px; box-shadow: 0 18px 45px rgba(60, 70, 120, .14); }
        .login-card .card-header { background: transparent; border: 0; padding-bottom: 0; text-align: center; }
        .login-card .card-body { padding: 1.6rem 2rem 2rem; }
        .login-logo { width: 64px; height: 64px; object-fit: contain; margin-bottom: .5rem; }
        .login-title { font-weight: 700; color: #2b2f45; }
        .login-sub { color: #6b7085; font-size: .9rem; }
        .form-control:focus { box-shadow: 0 0 0 .2rem rgba(90, 90, 200, .15); border-color: #7a7ad0; }
        .btn-login { background: linear-gradient(90deg, #6c63d6, #a06bd8); border: 0; color: #fff; font-weight: 600; }
        .demo-note { background: #f5f4ff; border-radius: 10px; font-size: .82rem; color: #565b78; }
    </style>
</head>
<body class="hold-transition">
    <div class="card login-card">
        <div class="card-header">
            <img src="/assets/img/logo-donga.png" alt="Đại học Đông Á" class="login-logo" />
            <h4 class="login-title mb-1">Quản lý tốt nghiệp</h4>
            <p class="login-sub mb-0">Hệ thống Quản lý Đào tạo · Nhóm 11</p>
        </div>
        <div class="card-body">
            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Tài khoản</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="admin" required />
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
                    </div>
                </div>
                <button type="submit" class="btn btn-login w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
                </button>
            </form>
            <div class="demo-note mt-3 p-3">
                <i class="bi bi-info-circle me-1"></i>
                <strong>Tài khoản demo:</strong> <code>admin</code> / <code>admin123</code><br />
                Chỉ cán bộ/giáo vụ (admin) được truy cập toàn bộ phân hệ.
            </div>
        </div>
    </div>

    <script type="module">
        import { login } from '/assets/js/graduation-auth.js?v=20261123_auth1';

        const form = document.getElementById('loginForm');
        const errBox = document.getElementById('loginError');
        const params = new URLSearchParams(location.search);
        const redirect = params.get('redirect');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const result = login(
                document.getElementById('username').value,
                document.getElementById('password').value,
                redirect
            );
            if (!result.ok) {
                errBox.textContent = result.message;
                errBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
